name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -v
      - name: Verify vendored upstream files
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('pihole/vendor')
          for f,m in json.loads((p/'sources.json').read_text()).items():
              assert hashlib.sha256((p/f).read_bytes()).hexdigest()==m['sha256'], f
          PY
      - name: Build from pinned sources
        run: docker build -t ha-pihole:test pihole
